
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarzan AI - ربط واتساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900/90 border border-emerald-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-md">
        
        <div class="text-center mb-8">
            <div class="inline-flex p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl mb-3 text-emerald-400">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-emerald-400 tracking-wide">Tarzan AI Bot</h1>
            <p class="text-xs text-slate-400 mt-1">ربط البوت عبر رمز الإقران (Pairing Code)</p>
        </div>

        <form id="pairForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">رقم الهاتف الدولي:</label>
                <div class="relative">
                    <input type="text" id="phone" placeholder="مثال: 967770000000" required
                        class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-4 py-3 text-left dir-ltr text-white placeholder-slate-600 outline-none transition-all">
                </div>
                <p class="text-xs text-slate-500 mt-1">اكتب الرقم شاملاً رمز الدولة بدون علامة (+)</p>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
                <span>طلب رمز الإقران</span>
            </button>
        </form>

        <div id="resultBox" class="hidden mt-6 text-center p-4 rounded-2xl border bg-slate-950/80">
            <p id="resultText" class="text-sm mb-2 font-medium"></p>
            <div id="codeDisplay" class="hidden font-mono text-3xl font-extrabold text-emerald-400 tracking-widest bg-slate-900 border border-emerald-500/40 p-3 rounded-xl select-all cursor-pointer shadow-inner"></div>
        </div>

        <div class="mt-8 border-t border-slate-800 pt-4 text-center">
            <p class="text-xs text-slate-500">تم التطوير بواسطة <span class="text-emerald-400 font-bold">طرزان الواقدي 👑</span></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('pairForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        const codeDisplay = document.getElementById('codeDisplay');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-spin">⏳</span> جاري طلب الرمز...';
            resultBox.classList.add('hidden');
            codeDisplay.classList.add('hidden');

            try {
                const res = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: phone })
                });

                const data = await res.json();

                resultBox.classList.remove('hidden');

                if (data.status === 'success') {
                    resultBox.className = "mt-6 text-center p-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/10";
                    resultText.className = "text-sm mb-2 font-bold text-emerald-400";
                    resultText.innerText = "تم استخراج رمز الإقران بنجاح! أدخله في الواتساب:";
                    
                    codeDisplay.innerText = data.code;
                    codeDisplay.classList.remove('hidden');
                } else if (data.status === 'already_registered') {
                    resultBox.className = "mt-6 text-center p-4 rounded-2xl border border-blue-500/30 bg-blue-500/10";
                    resultText.className = "text-sm text-blue-400 font-bold";
                    resultText.innerText = data.message;
                } else {
                    resultBox.className = "mt-6 text-center p-4 rounded-2xl border border-red-500/30 bg-red-500/10";
                    resultText.className = "text-sm text-red-400 font-bold";
                    resultText.innerText = data.error || "حدث خطأ غير متوقع";
                }
            } catch (err) {
                resultBox.classList.remove('hidden');
                resultBox.className = "mt-6 text-center p-4 rounded-2xl border border-red-500/30 bg-red-500/10";
                resultText.className = "text-sm text-red-400 font-bold";
                resultText.innerText = "فشل الاتصال بالسيرفر. حاول لاحقاً.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'طلب رمز الإقران';
            }
        });
    </script>
</body>
</html>
