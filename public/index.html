<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚜️ بـوت الـكـاريـزمـا | لوحة الربط والتحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --bg-dark: #0a0b0e;
            --card-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(212, 175, 55, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1a1c23 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
        }

        .header-logo {
            font-size: 2.8rem;
            color: var(--gold);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #a0aec0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            box-shadow: 0 0 10px #ff4757;
        }

        .status-dot.online {
            background: #2ed573;
            box-shadow: 0 0 10px #2ed573;
        }

        .tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 25px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #a0aec0;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--gold-light);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 1.05rem;
            direction: ltr;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold) 0%, #b8860b 100%);
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.25);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .code-display {
            margin-top: 25px;
            padding: 18px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px dashed var(--gold);
            border-radius: 14px;
            display: none;
        }

        .code-number {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--gold-light);
            margin: 10px 0;
            font-family: monospace;
        }

        .qr-box {
            padding: 15px;
            background: #fff;
            border-radius: 16px;
            display: inline-block;
            margin: 15px 0;
            box-shadow: 0 0 25px rgba(255,255,255,0.1);
        }

        .qr-box img {
            width: 210px;
            height: 210px;
            display: block;
        }

        .channel-card {
            margin-top: 30px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channel-card a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .loader {
            display: none;
            margin: 15px auto;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-logo">⚜️</div>
    <h1>بـوت الـكـاريـزمـا VIP</h1>
    <p class="subtitle">نظام ربط الواتساب السريع والترويج الفاخر</p>

    <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">جاري التحقق من السيرفر...</span>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pair')">🔑 كود الاقتران</button>
        <button class="tab-btn" onclick="switchTab('qr')">📷 مسح كود QR</button>
    </div>

    <!-- قسم كود الاقتران -->
    <div id="pairSection" class="content-section active">
        <div class="input-group">
            <label>رقم الواتساب مع الرمز الدولي (مثال: 201012345678)</label>
            <input type="text" id="phoneInput" placeholder="201000000000">
        </div>
        <button class="btn-action" onclick="requestPairCode()">الحصول على كود الربط ⚡</button>
        
        <div class="loader" id="pairLoader"></div>

        <div class="code-display" id="codeDisplay">
            <span style="font-size: 0.85rem; color: #a0aec0;">كود الاقتران الخاص بك:</span>
            <div class="code-number" id="pairCode">----</div>
            <p style="font-size: 0.8rem; color: #888;">أدخله في إشعار الواتساب الظاهر بفي هاتفك للربط</p>
        </div>
    </div>

    <!-- قسم QR Code -->
    <div id="qrSection" class="content-section">
        <p style="font-size: 0.85rem; color: #a0aec0; margin-bottom: 10px;">قم بمسح الكود باستخدام الواتساب على هاتفك:</p>
        <div class="qr-box">
            <img id="qrImg" src="" alt="جاري تحميل كود QR...">
        </div>
        <div>
            <button class="btn-action" style="padding: 10px 20px; width: auto; font-size: 0.85rem;" onclick="checkQR()">🔄 تحديث الـ QR</button>
        </div>
    </div>

    <div class="channel-card">
        <span style="font-size: 0.85rem; color: #ccc;">القناة الرسمية للبوت:</span>
        <a href="https://whatsapp.com/channel/0029Vb8XYYwKmCPO3sQkrJ1C" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> انضمام للقناة
        </a>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

        if(tab === 'pair') {
            event.target.classList.add('active');
            document.getElementById('pairSection').classList.add('active');
        } else {
            event.target.classList.add('active');
            document.getElementById('qrSection').classList.add('active');
            checkQR();
        }
    }

    async function checkStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if(data.isConnected) {
                dot.className = 'status-dot online';
                text.innerText = 'البوت متصل وجاهز للعمل ✅';
            } else {
                dot.className = 'status-dot';
                text.innerText = 'غير متصل (بانتظار الربط) ⏳';
            }
        } catch(e) {
            document.getElementById('statusText').innerText = 'خطأ في الاتصال بالسيرفر';
        }
    }

    async function requestPairCode() {
        const phone = document.getElementById('phoneInput').value.trim();
        if(!phone) return alert('يرجى كتابة رقم الهاتف أولاً!');

        const loader = document.getElementById('pairLoader');
        const codeDisplay = document.getElementById('codeDisplay');
        loader.style.display = 'block';
        codeDisplay.style.display = 'none';

        try {
            const res = await fetch('/api/pair', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await res.json();
            loader.style.display = 'none';

            if(data.success) {
                document.getElementById('pairCode').innerText = data.code;
                codeDisplay.style.display = 'block';
            } else {
                alert(data.message || data.error || 'حدث خطأ أثناء الطلب');
            }
        } catch(e) {
            loader.style.display = 'none';
            alert('تعذر الاتصال بالسيرفر');
        }
    }

    async function checkQR() {
        try {
            const res = await fetch('/api/qr');
            const data = await res.json();
            if(data.qr) {
                document.getElementById('qrImg').src = data.qr;
            } else {
                document.getElementById('qrImg').alt = 'البوت متصل أو جاري التجهيز...';
            }
        } catch(e) {}
    }

    setInterval(checkStatus, 5000);
    checkStatus();
</script>

</body>
</html>
